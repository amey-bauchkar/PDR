<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07008F" />
    
    <!-- SEO: Robots directive -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- SEO: Author & Publisher -->
    <meta name="author" content="PDR Videotronics India Pvt. Ltd." />
    
    <!-- SEO: Geo-targeting for India/Mumbai -->
    <meta name="geo.region" content="IN-MH" />
    <meta name="geo.placename" content="Mumbai" />
    <meta name="geo.position" content="19.0144;72.8295" />
    <meta name="ICBM" content="19.0144, 72.8295" />
    
    
    <!-- Deployment version tracking for cache busting -->
    <meta name="deployment-version" content="{{COMMIT_SHA}}" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Performance: DNS prefetch for external domains -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <!-- Performance: Preconnect + Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    
    <!-- Performance: Preload LCP hero image -->
    <link rel="preload" as="image" type="image/webp" href="/images/hero-infrastructure.webp" />
    
    <title>PDR World — Optical Fiber Components, Cables & Test Equipment</title>
    <meta name="description" content="PDR Videotronics is an ISO-certified Indian manufacturer of high-performance fiber optic patch cords, 1G-400G optical transceivers, splice enclosures, and testing instruments." />
    
    <!-- Open Graph / WhatsApp / Facebook Link Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PDR World" />
    <meta property="og:title" content="PDR World — Optical Fiber Components, Cables & Test Equipment" />
    <meta property="og:description" content="PDR Videotronics is an ISO-certified Indian manufacturer of high-performance fiber optic patch cords, 1G-400G optical transceivers, splice enclosures, and testing instruments." />
    <meta property="og:url" content="https://pdrworld.com" />
    <meta property="og:image" content="https://pdrworld.com/og-card.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PDR World — Optical Fiber Components, Cables & Test Equipment" />
    <meta name="twitter:description" content="PDR Videotronics is an ISO-certified Indian manufacturer of high-performance fiber optic patch cords, 1G-400G optical transceivers, splice enclosures, and testing instruments." />
    <meta name="twitter:image" content="https://pdrworld.com/og-card.png" />

    <!-- Tracking scripts are injected dynamically by CookieConsent.tsx upon user consent -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
